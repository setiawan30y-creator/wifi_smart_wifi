[program:wifi-smartbilling-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/wifi_smartbilling/artisan queue:work redis --sleep=3 --tries=3 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/wifi_smartbilling/storage/logs/worker.log
stopwaitsecs=3600
